<style>
  *{box-sizing:border-box}
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  html,body{height:100%}
  body{margin:0;background:#EDEFEA;font-family:'Plus Jakarta Sans',system-ui,sans-serif;
       -webkit-font-smoothing:antialiased;color:#16211A;overflow-x:hidden}
  img{max-width:100%}
  a{color:#5B34C9;text-decoration:none}
  a:hover{opacity:.85}
  table{font-size:14px}
  @keyframes fdSpin{to{transform:rotate(360deg)}}
  ::selection{background:#DCCBFB;color:#16211A}

  /* a pagina ocupa a tela inteira: abertura centralizada, rodape no fim */
  .lv-pagina{min-height:100vh;min-height:100dvh;
    background:
      radial-gradient(circle at 88% 6%, rgba(198,155,242,.34) 0%, rgba(237,239,234,0) 58%),
      radial-gradient(circle at 2% 62%, rgba(139,92,246,.16) 0%, rgba(237,239,234,0) 55%),
      #EDEFEA}
  .lv-secao-topo{flex:1 0 auto;display:flex;flex-direction:column;justify-content:center;padding-top:40px !important;padding-bottom:40px !important}
  .lv-pagina .lv-rodape{margin-top:auto}

  /* os links do rodape usam a largura toda, para quebrarem a linha
     em vez de vazarem para fora da tela */
  .lv-rodape .lv-rodape-links{width:100%}


  /* a barra de status do celular fica por cima da pagina: o cabecalho
     desce o tanto que o proprio aparelho informa (zero no computador) */
  .lv-cabecalho{padding-top:calc(24px + env(safe-area-inset-top,0px)) !important}
  .lv-rodape{padding-bottom:calc(46px + env(safe-area-inset-bottom,0px)) !important}

  /* os links do rodape nunca quebram no meio da palavra */
  .lv-rodape a{white-space:nowrap}

  /* --- celular --- */
  @media (max-width:900px){
    header, main, footer, section{padding-left:22px !important;padding-right:22px !important}
    h2{font-size:19px !important}
    .lv-linha{flex-direction:column !important;gap:40px !important;align-items:flex-start !important}
    .lv-cards{grid-template-columns:minmax(0,1fr) !important}
    .lv-cta{flex-direction:column !important;align-items:flex-start !important;gap:28px !important;padding:40px 26px !important}
    .lv-telefone{margin:0 auto}
    .lv-rodape{flex-direction:column !important;align-items:flex-start !important;gap:18px !important}
    .lv-doc-abas{gap:8px !important}
  }

  /* --- tela pequena: a pagina inicial cabe sem rolagem --- */
  @media (max-width:560px){
    h1{font-size:31px !important;line-height:1.15 !important}
    .lv-cabecalho{padding-top:calc(16px + env(safe-area-inset-top,0px)) !important;
                  padding-bottom:16px !important}
    .lv-secao-topo{padding-top:30px !important;padding-bottom:34px !important}
    .lv-secao-topo .lv-texto{gap:19px !important}
    .lv-etiqueta{font-size:12.5px !important;padding:9px 17px !important}
    .lv-sub{font-size:18.5px !important;line-height:1.55 !important}
    .lv-botoes{gap:12px !important;margin-top:8px !important;margin-bottom:26px !important}
    .lv-botao-principal{padding:19px 32px !important;font-size:17.5px !important}
    .lv-botao-loja{padding:17px 27px !important;font-size:15.5px !important}
    .lv-rodape{padding-top:24px !important;gap:13px !important;
               padding-bottom:calc(26px + env(safe-area-inset-bottom,0px)) !important}
    .lv-rodape-links{gap:12px 20px !important;font-size:15px !important}
    .lv-rodape span{font-size:13.5px !important}
  }
  /* telas mais baixas: encolhe o suficiente para continuar cabendo */
  @media (max-width:560px) and (max-height:730px){
    h1{font-size:27px !important}
    .lv-secao-topo{padding-top:20px !important;padding-bottom:24px !important}
    .lv-sub{font-size:16.5px !important}
    .lv-botao-principal{padding:17px 29px !important;font-size:16px !important}
    .lv-botao-loja{padding:15px 24px !important;font-size:14.5px !important}
    .lv-rodape{padding-top:20px !important;gap:11px !important}
  }
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important}
  }
</style>
</head>
<body>

          <linearGradient id="hdB" x1="0" y1="0" x2=".4" y2="1"><stop offset="0" stop-color="#9B5CF0"></stop><stop offset="1" stop-color="#5B34C9"></stop></linearGradient>
        </defs>
        <path d="M32 57.5C13.5 44 4.4 35 4.4 26A14.07 14.07 0 0 1 32 22Z" fill="url(#hdA)"></path>
        <path d="M32 57.5C50.5 44 59.6 35 59.6 26A14.07 14.07 0 0 0 32 22Z" fill="url(#hdB)"></path>
      </svg>
      <span style="font:900 25px 'Nunito', sans-serif; letter-spacing:-.02em; color:#5B34C9;">lovi</span>

    <a href="https://lovidates.com/app1" style="font:700 14px 'Plus Jakarta Sans'; color:#5B34C9; background:#fff; border:1px solid #DCCBFB; padding:11px 22px; border-radius:999px;">Testar agora</a>

  <section class="lv-secao-topo" style="width:100%; box-sizing:border-box; position:relative; padding:64px 56px 80px;">
    
    

    <div class="lv-linha" style="max-width:1180px; margin:0 auto; display:flex; align-items:center; gap:72px; position:relative;">
      <div class="lv-texto" style="flex:1; display:flex; flex-direction:column; gap:24px; max-width:580px;">

        <h1 style="margin:0; font-size:56px; font-weight:800; letter-spacing:-.035em; line-height:1.04; color:#16211A; text-wrap:balance;">Conheça alguém que busca a mesma coisa que você.</h1>
        <p class="lv-sub" style="margin:0; font-size:19px; line-height:1.6; color:#5C6660; max-width:480px; text-wrap:pretty;">No lovi você declara sua intenção antes de aparecer pra alguém — e só combina com quem busca o mesmo.</p>
        <div class="lv-botoes" style="display:flex; gap:14px; align-items:center; flex-wrap:wrap; margin-top:12px;">
          <a class="lv-botao-principal" href="https://lovidates.com/app1" style="display:inline-flex; align-items:center; gap:10px; font:700 16px 'Plus Jakarta Sans'; color:#fff; background:linear-gradient(150deg,#8B5CF6 0%,#6B2FD6 100%); padding:17px 32px; border-radius:999px; box-shadow:0 14px 30px -12px rgba(107,47,214,.8);">
            Testar a versão web
            <svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"></path></svg>
          </a>
          <span class="lv-botao-loja" style="display:inline-flex; align-items:center; gap:9px; font:600 14px 'Plus Jakarta Sans'; color:#5C6660; background:#fff; border:1px solid #DCE0D8; padding:15px 24px; border-radius:999px;">
            <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.4 12.7c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.5-.2-2.8.8-3.6.8-.7 0-1.9-.8-3.1-.8-1.6 0-3 .9-3.8 2.3-1.6 2.8-.4 7 1.2 9.3.8 1.1 1.7 2.4 2.9 2.3 1.2 0 1.6-.7 3-.7s1.8.7 3 .7 2-1.1 2.8-2.2c.9-1.3 1.2-2.5 1.3-2.6-.1 0-2.4-.9-2.4-3.6z" fill="#5C6660"></path><path d="M14.3 5.7c.6-.8 1.1-1.9 1-3-.9 0-2.1.6-2.8 1.4-.6.7-1.1 1.8-1 2.9 1 .1 2.1-.5 2.8-1.3z" fill="#5C6660"></path></svg>
            Em breve na App Store
          </span>
        </div>
      </div>

    </div>
  </section>

  <footer class="lv-rodape" style="width:100%; box-sizing:border-box; padding:34px 56px 46px; border-top:1px solid #DCE0D8; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:18px;">
    <div style="display:flex; align-items:center; gap:10px;">
      <svg width="20" height="20" viewBox="0 0 64 64">
        <defs>
          <linearGradient id="ftA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F6CEFF"></stop><stop offset="1" stop-color="#C79BF2"></stop></linearGradient>
          <linearGradient id="ftB" x1="0" y1="0" x2=".4" y2="1"><stop offset="0" stop-color="#9B5CF0"></stop><stop offset="1" stop-color="#5B34C9"></stop></linearGradient>
        </defs>
        <path d="M32 57.5C13.5 44 4.4 35 4.4 26A14.07 14.07 0 0 1 32 22Z" fill="url(#ftA)"></path>
        <path d="M32 57.5C50.5 44 59.6 35 59.6 26A14.07 14.07 0 0 0 32 22Z" fill="url(#ftB)"></path>
      </svg>
      <span style="font:900 17px 'Nunito', sans-serif; color:#5B34C9;">lovi</span>
    </div>
    <div class="lv-rodape-links" style="display:flex; gap:26px; font:500 14px 'Plus Jakarta Sans'; color:#5C6660; flex-wrap:wrap;">
      <a href="/termos/" style="color:#5C6660;">Termos de uso</a>
      <a href="/privacidade/" style="color:#5C6660;">Privacidade</a>
      <a href="/diretrizes/" style="color:#5C6660;">Diretrizes</a>

    <span style="font:500 13px 'Plus Jakarta Sans'; color:#8A928B;">lovidates.com</span>
