<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lovi — em breve</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --blush: #FBEFEC;
    --wine: #3A1E28;
    --coral: #E8637A;
    --peach: #F4B8AE;
    --muted: #6B4A56;
    --faint: #A9808C;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--blush);
    color: var(--wine);
    font-family: 'Inter', system-ui, sans-serif;
    text-align: center;
    padding: 24px;
    position: relative;
    overflow: hidden;
  }
  .glow {
    position: absolute;
    width: 480px;
    height: 480px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--peach) 0%, transparent 70%);
    top: -140px;
    right: -140px;
    opacity: 0.6;
    pointer-events: none;
  }
  .content {
    max-width: 480px;
    position: relative;
    z-index: 1;
  }
  .wordmark {
    font-family: 'Fraunces', serif;
    font-size: 1.6rem;
    font-weight: 600;
    color: var(--coral);
    margin: 0 0 32px;
    letter-spacing: 0.02em;
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 400;
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    line-height: 1.3;
    margin: 0 0 16px;
  }
  p.sub {
    font-size: 1rem;
    line-height: 1.6;
    color: var(--muted);
    margin: 0;
  }
  footer {
    margin-top: 48px;
    font-size: 0.85rem;
    color: var(--faint);
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="content">
    <p class="wordmark">lovi</p>
    <h1>Uma forma diferente de conhecer alguém está a caminho.</h1>
    <p class="sub">Estamos com os últimos preparativos. Volte em breve.</p>
    <footer>lovidates.com</footer>
  </div>
</body>
</html>
