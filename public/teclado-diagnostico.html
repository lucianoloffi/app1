<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Diagnóstico do teclado</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
      body { font: 13px/1.35 -apple-system, system-ui, sans-serif; background: #e9e4f3; }
      /* Mesma estrutura do app: raiz fixa, coluna, cabeçalho preso no topo. */
      #raiz {
        position: fixed; top: var(--desloc, 0px); left: 0; width: 100%;
        height: var(--altura, 100dvh); display: flex; flex-direction: column; background: #fff;
      }
      #topo { flex: none; background: #7c4dff; color: #fff; padding: 14px 16px; font-weight: 700; font-size: 16px; }
      #meio { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 16px; color: #666; }
      /* O painel fica ACIMA do campo, colado no pé: assim continua visível com
         o teclado aberto, que é justamente quando os números interessam. */
      #baixo { flex: none; border-top: 1px solid #ddd; padding: 8px 12px 16px; background: #fff; }
      #veredito { font-weight: 800; font-size: 15px; padding: 4px 0; }
      #medidas { white-space: pre; font: 11px/1.35 ui-monospace, monospace; }
      input { width: 100%; font-size: 16px; padding: 10px; border: 1px solid #bbb; border-radius: 999px; box-sizing: border-box; margin-top: 8px; }
    </style>
  </head>
  <body>
    <div id="raiz">
      <div id="topo">TOPO — este bloco tem de continuar visível</div>
      <div id="meio">Toque no campo e tire um print. O painel de medidas fica logo acima do campo, então aparece no print.</div>
      <div id="baixo">
        <div id="veredito">—</div>
        <div id="medidas">carregando…</div>
        <input id="campo" type="text" placeholder="Toque aqui" />
      </div>
    </div>
    <script>
      // Espelha a lógica do app: aprende a altura do teclado e, no foco
      // seguinte, encolhe ANTES de o teclado subir.
      var vv = window.visualViewport;
      var topo = document.getElementById('topo');
      var saida = document.getElementById('medidas');
      var veredito = document.getElementById('veredito');
      var raiz = document.documentElement;
      var ate = 0, alturaEscrita = -1, deslocEscrito = -1, escritas = 0;
      var CHAVE = 'lovi:altura-do-teclado';
      var alturaDoTeclado = 0;
      var alturaCheia = window.innerHeight;
      try { alturaDoTeclado = JSON.parse(localStorage.getItem(CHAVE)) || 0; } catch (e) {}

      function focado() {
        var a = document.activeElement;
        return !!a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA');
      }
      function plausivel(h) { return h >= 180 && h <= alturaCheia * 0.75; }
      function escrever(h) {
        if (h === alturaEscrita) return;
        raiz.style.setProperty('--altura', h + 'px');
        alturaEscrita = h; escritas++;
      }

      function medir() {
        if (!vv) { saida.textContent = 'sem visualViewport'; return; }

        if (focado()) {
          var medida = Math.min(window.innerHeight, vv.height);
          var coberto = Math.round(alturaCheia - medida);
          if (plausivel(coberto) && coberto !== alturaDoTeclado) {
            alturaDoTeclado = coberto;
            try { localStorage.setItem(CHAVE, JSON.stringify(coberto)); } catch (e) {}
          }
          var previsto = alturaDoTeclado > 0 ? alturaCheia - alturaDoTeclado : medida;
          escrever(Math.min(medida, previsto));

          var desloc = Math.round(vv.offsetTop);
          if (desloc !== deslocEscrito) {
            if (desloc > 0) raiz.style.setProperty('--desloc', desloc + 'px');
            else raiz.style.removeProperty('--desloc');
            deslocEscrito = desloc;
          }
          if (window.scrollY !== 0) window.scrollTo(0, 0);
        } else {
          raiz.style.removeProperty('--altura');
          raiz.style.removeProperty('--desloc');
          alturaEscrita = -1; deslocEscrito = -1; escritas = 0;
          alturaCheia = window.innerHeight;
        }

        var r = topo.getBoundingClientRect();
        var ok = r.top >= -1 && r.bottom <= vv.height + 1;
        veredito.textContent = ok ? 'TOPO VISÍVEL: SIM' : 'TOPO VISÍVEL: NÃO';
        veredito.style.color = ok ? '#0a7d2b' : '#c62828';

        saida.textContent = [
          'innerHeight ' + window.innerHeight + '   vv.height ' + Math.round(vv.height),
          'vv.offsetTop ' + Math.round(vv.offsetTop) + '   scrollY ' + Math.round(window.scrollY),
          'foco ' + (focado() ? 'sim' : 'nao') + '   teclado aprendido ' + alturaDoTeclado,
          'TOPO top ' + Math.round(r.top) + '   bottom ' + Math.round(r.bottom),
          '--altura ' + (raiz.style.getPropertyValue('--altura') || '(sem)'),
          'redimensionou ' + escritas + 'x  (1 = sem pulo)',
        ].join('\n');
      }

      function insistir() {
        medir();
        if (performance.now() < ate) requestAnimationFrame(insistir);
      }
      if (vv) {
        vv.addEventListener('resize', medir);
        vv.addEventListener('scroll', medir);
      }
      window.addEventListener('scroll', medir);
      document.addEventListener('focusin', function () {
        if (alturaEscrita === -1) alturaCheia = window.innerHeight;
        if (alturaDoTeclado > 0 && plausivel(alturaDoTeclado) && focado()) {
          escrever(alturaCheia - alturaDoTeclado);
        }
        ate = performance.now() + 900; insistir();
      });
      document.addEventListener('focusout', function () { ate = 0; setTimeout(medir, 120); });
      setInterval(medir, 400);
      medir();
    </script>
  </body>
</html>
